# Included from pikvm-dashboard.conf inside each server{} block.

client_max_body_size 0;

# --- The dashboard app itself (login page, dashboard page, /api/*) ---
location / {
    proxy_pass http://pikvm_dashboard_app;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- Internal-only: nginx calls this to check the site session, and to
#     fetch the current piKVM auth token for the slug being requested. ---
location = /internal/verify {
    internal;
    proxy_pass http://pikvm_dashboard_app/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-PiKVM-Slug $pikvm_slug;
}

# =========================================================================
# One location block per piKVM. Duplicate this block for every entry in
# pikvms.json, updating: the location path, $pikvm_slug, and proxy_pass
# target (must match that piKVM's `host`).
# =========================================================================

# --- rack1 -> https://192.168.1.50 ---
location /kvm/rack1/ {
    set $pikvm_slug "rack1";

    auth_request /internal/verify;
    auth_request_set $pikvm_token $upstream_http_x_pikvm_token;

    # No valid site session -> send the browser to the login page.
    error_page 401 = @login_redirect;

    proxy_pass https://192.168.1.50/;
    proxy_ssl_verify off; # piKVM's self-signed cert — trusted LAN traffic only

    # Inject the shared piKVM session in place of whatever cookie the
    # browser sent us — this is what makes login "just work" for everyone.
    proxy_set_header Cookie "auth_token=$pikvm_token";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;

    # Required for piKVM's WebSocket-based video/HID stream.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# --- rack2 -> https://192.168.1.51 ---
location /kvm/rack2/ {
    set $pikvm_slug "rack2";

    auth_request /internal/verify;
    auth_request_set $pikvm_token $upstream_http_x_pikvm_token;

    error_page 401 = @login_redirect;

    proxy_pass https://192.168.1.51/;
    proxy_ssl_verify off;

    proxy_set_header Cookie "auth_token=$pikvm_token";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location @login_redirect {
    return 302 /;
}
