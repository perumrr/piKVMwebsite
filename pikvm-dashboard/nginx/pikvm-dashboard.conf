# pikvm-dashboard nginx config
#
# Replace `dashboard.example.lan` with your real hostname, and adjust the
# `/kvm/<slug>/` blocks to match every entry in pikvms.json (slug + host).
#
# TLS: shown commented-out below. For a LAN-only deployment a self-signed
# cert is fine; for anything broader, use a real cert (e.g. via your
# internal CA or Let's Encrypt with DNS validation). Session cookies are
# set with `Secure`, so the app REQUIRES HTTPS in front once NODE_ENV=production.

upstream pikvm_dashboard_app {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name dashboard.example.lan;

    # Uncomment to force HTTPS once TLS is configured below:
    # return 301 https://$host$request_uri;

    include /etc/nginx/snippets/pikvm-dashboard-locations.conf;
}

