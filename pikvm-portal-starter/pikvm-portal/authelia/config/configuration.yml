server:
  address: 'tcp4://:9091'

log:
  level: 'info'
  keep_stdout: true

totp:
  disable: false
  issuer: 'example.com'
  period: 30
  skew: 1

password_policy:
  zxcvbn:
    enabled: true
    min_score: 3

authentication_backend:
  file:
    path: '/config/users.yml'
    watch: true
    password:
      algorithm: 'argon2'
      argon2:
        variant: 'argon2id'
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16

access_control:
  default_policy: 'deny'
  rules:
    - domain:
        - 'example.com'
        - 'auth.example.com'
        - 'portal.example.com'
        - 'kvm1.example.com'
      policy: 'one_factor'

session:
  name: 'pikvm_session'
  secret: '{{ secret "/secrets/session_secret.txt" | mindent 0 "|" | msquote }}'
  same_site: 'lax'
  inactivity: '30m'
  expiration: '12h'
  remember_me: '7d'
  cookies:
    - domain: 'example.com'
      authelia_url: 'https://auth.example.com'
      default_redirection_url: 'https://portal.example.com'

regulation:
  max_retries: 5
  find_time: '2m'
  ban_time: '5m'

storage:
  encryption_key: '{{ secret "/secrets/storage_encryption_key.txt" | mindent 0 "|" | msquote }}'
  local:
    path: '/config/db.sqlite3'

notifier:
  filesystem:
    filename: '/config/notification.txt'
