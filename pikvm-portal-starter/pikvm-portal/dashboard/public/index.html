<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PiKVM Portal</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">REMOTE MANAGEMENT</div>
      <h1>PiKVM Portal</h1>
    </div>
    <a class="logout" href="https://auth.example.com/logout">Logout</a>
  </header>

  <main class="container">
    <section class="intro">
      <h2>Your PiKVMs</h2>
      <p>Status refreshes automatically every 10 seconds.</p>
    </section>

    <div id="message" class="message">Loading PiKVMs…</div>
    <section id="cards" class="grid" aria-live="polite"></section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
